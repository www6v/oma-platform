name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go.sum

      - name: E2E smoke (create agent → session → message → reply)
        run: go test ./internal/api/ -run TestE2ESmoke -count=1 -v

      - name: Data analyst cookbook (Go server parity §3–6)
        run: go test ./internal/api/ ./test/integration/ -run TestDataAnalystCookbook -count=1 -v

      - name: Iterate cookbook MT1 (multi-turn same session)
        run: go test ./internal/api/ ./test/integration/ -run TestIterateCookbookMultiTurn -count=1 -v

      - name: Gate cookbook HITL (requires_action + resume)
        run: go test ./internal/api/ ./test/integration/ -run TestGateCookbook -count=1 -v

      - name: Crash recovery (SIGKILL → restart, ported from main-node)
        run: go test ./internal/api/ -run TestCrashRecovery -count=1 -v

  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go.sum

      - name: go test
        run: go test ./... -count=1

  harness-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: OMA contract tests
        working-directory: harness
        run: PYTHONPATH=. pytest tests/test_oma_contract.py -v

      - name: Gate custom-tool harness tests
        working-directory: harness
        run: PYTHONPATH=. pytest tests/test_custom_tools.py tests/test_project.py -q

      - name: SDK cookbook helpers (gate HITL + iterate)
        working-directory: sdk
        run: |
          pip install pytest pytest-asyncio "anthropic>=0.111.0" httpx
          PYTHONPATH=. pytest tests/test_gate_cookbook.py tests/test_cookbook.py tests/test_iterate_cookbook.py -q
