[project]
name = "oma-sdk"
version = "0.1.0"
description = "Python SDK for oma-platform — validates all APIs using the Anthropic SDK with custom base_url"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.111.0",
  "httpx>=0.28.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oma_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that call a real LLM and harness (slow, kept for Console demo)",
]
