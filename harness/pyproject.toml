[project]
name = "oma-harness"
version = "0.1.0"
description = "OMA piPy harness sidecar"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.28.0",
  "markdownify>=0.14.0",
  "pi-coding-agent",
  "pi-ai",
  "pi-subagent",
  "pi-team",
  "pi-dynamic-workflows",
  "mcp>=1.27.2",
  # Required by pi-dynamic-workflows when DATABASE_URL is set (MySQL backend).
  # Listed here so harness venv picks it up even if the workflows package was
  # installed from an older git pin that didn't declare pymysql yet.
  "pymysql>=1.1.0",
  # OMA platform SDK — workflow bootstrap uses it to create OMA agents /
  # sessions so workflow executions appear in /agents and /sessions.
  "oma-sdk",
]

[tool.uv.sources]
pi-coding-agent = { git = "https://gitee.com/www6v6v/piPy.git", branch = "v0.3.0", subdirectory = "packages/pi_coding_agent" }
pi-ai = { git = "https://gitee.com/www6v6v/piPy.git", branch = "v0.3.0", subdirectory = "packages/pi_ai" }
pi-subagent = { git = "https://gitee.com/www6v6v/pipy-subagent.git", branch = "v0.1.0", subdirectory = "packages/pi_subagent" }
pi-team = { git = "https://gitee.com/www6v6v/pipy-teams.git", branch = "v0.1.0", subdirectory = "packages/pi_team" }
pi-dynamic-workflows = { git = "https://gitee.com/www6v6v/pipy-dynamic-workflows.git", branch = "v0.1.0", subdirectory = "packages/pi_dynamic_workflows" }
oma-sdk = { git = "https://gitee.com/www6v6v/oma-sdk.git", branch = "master" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: real oma-server + harness integration (requires OMA_FAKE_HARNESS=0)",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-httpx>=0.35.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oma_adapter"]
