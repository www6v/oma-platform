# Standalone compose for oma-deepseek (DeepSeek dsh web gateway).
#
# Usage:
#   # Together with the main stack (recommended — shares network automatically):
#   docker compose -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.deepseek.yml up -d
#
#   # Independently (oma-deepseek joins the main stack's network so
#   # oma-platform can reach it at http://oma-deepseek:3080):
#   docker compose -f deploy/docker-compose.yml up -d   # start main stack first
#   docker compose -f deploy/docker-compose.deepseek.yml up -d
#   # Then connect the deepseek container to the main network:
#   docker network connect deploy_default $(docker compose -f deploy/docker-compose.deepseek.yml ps -q oma-deepseek)
#
#   # Fully standalone (no main stack):
#   docker compose -f deploy/docker-compose.deepseek.yml up -d
#   Then set OMA_DEEPSEEK_GATEWAY_URL=http://localhost:3080 in .env.

services:
  # DeepSeek dsh web gateway (harness Kind "deepseek").
  # Serves the dsh web UI + API on :3080. Port is exposed to the host
  # for standalone access; on the Docker network oma-platform reaches
  # it at http://oma-deepseek:3080 (matching .env default).
  oma-deepseek:
    build:
      context: ../../deepseek-harness-master
      dockerfile: deploy/Dockerfile.dsh
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
    env_file:
      - ../.env
    environment:
      DSH_HOME: /root/.pi/agent
    ports:
      - "0.0.0.0:${DSH_HOST_PORT:-3080}:3080"
    volumes:
      - ../data:/data
      - ${HOME}/.pi/agent:/root/.pi/agent
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3080/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 90s
    restart: unless-stopped
