# Standalone compose for oma-deepseek (DeepSeek dsh web gateway).
#
# Usage:
#   docker compose -f deploy/deepseek/docker-compose.yml up -d
#   ./start-deepseek.sh {start|stop|restart|status|logs|rebuild}
#
#   With the main harness stack (shares oma-network):
#   docker compose -f deploy/docker-compose.yml \
#     -f deploy/deepseek/docker-compose.yml up -d

services:
  oma-deepseek:
    build:
      context: ../../../deepseek-harness-master
      dockerfile: deploy/Dockerfile.dsh
      args:
        REGISTRY_MIRROR: ${REGISTRY_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
    env_file:
      - ../../.env
    environment:
      DSH_HOME: /root/.pi/agent
    ports:
      - "0.0.0.0:${DSH_HOST_PORT:-3080}:3080"
    volumes:
      - ../../data:/data
      - ${HOME}/.pi/agent:/root/.pi/agent
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3080/"]
      interval: 5s
      timeout: 3s
      retries: 240
      start_period: 90s
    restart: unless-stopped

networks:
  default:
    name: oma-network
