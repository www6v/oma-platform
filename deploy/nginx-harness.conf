# Harness load balancer: session sticky via X-OMA-Session-ID (consistent hash).
# Go platform sets the header from TurnRequest.session_id / workflow path ids.
# Empty header hashes to a stable peer (list/health endpoints).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    access_log    /var/log/nginx/access.log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Long agent turns + NDJSON streams.
    proxy_connect_timeout 60s;
    proxy_send_timeout    900s;
    proxy_read_timeout    900s;

    upstream oma_harness {
        hash $http_x_oma_session_id consistent;
        server oma-harness-1:8090 max_fails=3 fail_timeout=30s;
        server oma-harness-2:8090 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8090;
        server_name _;

        location /internal/turn/stream {
            proxy_pass http://oma_harness;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-OMA-Session-ID $http_x_oma_session_id;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding on;
        }

        location / {
            proxy_pass http://oma_harness;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-OMA-Session-ID $http_x_oma_session_id;
            # WebSocket upgrade for /api/workflows/.../ws
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }

        location = /health {
            proxy_pass http://oma_harness;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }
    }
}
