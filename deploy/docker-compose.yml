services:
  oma-auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.auth
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
    env_file:
      - ../.env
    environment:
      AUTH_LISTEN_ADDR: 0.0.0.0:8788
      # Better Auth + tenant helper now both talk to MySQL via DATABASE_URL
      # (inherited from env_file above). No local SQLite files needed.
      # Browser Origin must be trusted by Better Auth. PUBLIC_BASE_URL from
      # .env is always trusted (see auth-sidecar). Set TRUSTED_ORIGINS for
      # extra comma-separated origins (IP + domain, etc.).
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/auth/get-session').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  oma-platform:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.platform
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
    env_file:
      - ../.env
    ports:
      - "8787:8787"
    environment:
      # Container paths / in-network URLs only. App secrets and toggles
      # (OMA_FAKE_HARNESS, OMA_INTERNAL_SECRET, OMA_API_KEY, …) come from
      # env_file above — do not re-declare them here or they override .env.
      # Database: oma-platform now connects to MySQL via DATABASE_URL in .env;
      # no local SQLite file is used by the Go server anymore.
      SANDBOX_WORKDIR: /data/sandboxes
      # All artifact dirs must live on the shared /data volume so harness
      # (separate container) can follow workdir symlinks into session outputs.
      SESSION_OUTPUTS_DIR: /data/session-outputs
      FILES_DATA_DIR: /data/files
      SKILLS_DATA_DIR: /data/skills
      MEMORY_DATA_DIR: /data/memory
      HARNESS_URL: http://oma-harness:8090
      # Harness schedule/MCP tools call oma-server from the sidecar container.
      OMA_HARNESS_PLATFORM_BASE: http://oma-platform:8787
      # Slack/GitHub OAuth redirect_uri host (open-managed-agents GATEWAY_ORIGIN).
      # Prefer .env GATEWAY_ORIGIN / PUBLIC_BASE_URL; do not default to container
      # localhost or Slack will reject redirect_uri.
      CONSOLE_DIR: /app/console
      AUTH_UPSTREAM_URL: http://oma-auth:8788
    volumes:
      - ../data:/data
      # - ${CONSOLE_DIST:-../console/dist}:/app/console:ro
    depends_on:
      oma-auth:
        condition: service_healthy
      oma-harness:
        condition: service_healthy

  oma-harness:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.harness
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PYPI_MIRROR_PACKAGES: ${PYPI_MIRROR_PACKAGES:-https://pypi.tuna.tsinghua.edu.cn/packages}
    env_file:
      - ../.env
    ports:
      - "8090:8090"
    environment:
      OMA_PLATFORM_URL: http://oma-platform:8787
      OMA_DATABASE_PATH: /data/oma.db
    volumes:
      - ../data:/data
      - ${HOME}/.pi/agent:/root/.pi/agent:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
